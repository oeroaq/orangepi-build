name: Build R2S Debian 13 Router

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save build caches
        type: boolean
        default: true
      debian_snapshot:
        description: Debian snapshot (YYYYMMDDTHHMMSSZ)
        type: string
        default: '20260928T000000Z'
      kernel_commit:
        description: Full Linux commit (empty resolves orange-pi-6.6-ky)
        type: string
        default: ''
      uboot_commit:
        description: Full U-Boot commit (empty resolves v2022.10-ky)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: r2s-debian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      namespace: ${{ steps.context.outputs.namespace }}
      compat: ${{ steps.context.outputs.compat }}
      rootfs_key: ${{ steps.context.outputs.rootfs }}
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '10'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check pipeline helpers
        run: |
          python3 -B -m unittest discover -s ci/r2s -p 'test_*.py' -v
          for script in ci/r2s/*.sh ci/r2s/config.conf scripts/general.sh scripts/debootstrap.sh \
            scripts/main.sh scripts/distributions.sh scripts/compilation.sh; do
            bash -n "$script"
          done

      - name: Freeze all sources once
        id: locks
        env:
          SNAPSHOT: ${{ inputs.debian_snapshot }}
          KERNEL_COMMIT: ${{ inputs.kernel_commit }}
          UBOOT_COMMIT: ${{ inputs.uboot_commit }}
        run: |
          mkdir -p _ci/{state,logs,home,tmp,cache/sources,cache/toolchain} external/cache/{rootfs,ccache}
          export HOME="$GITHUB_WORKSPACE/_ci/home" TMPDIR="$GITHUB_WORKSPACE/_ci/tmp"
          python3 -B ci/r2s/prepare.py freeze --snapshot "$SNAPSHOT" \
            --kernel-commit "$KERNEL_COMMIT" --uboot-commit "$UBOOT_COMMIT"

      - name: Restore toolchain archive
        id: toolchain-cache
        if: inputs.use_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: _ci/cache/toolchain/*.tar.xz
          key: r2s-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.locks.outputs.toolchain_key }}

      - name: Restore Git objects (single cache writer)
        id: sources-cache
        if: inputs.use_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: _ci/cache/sources
          key: r2s-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.locks.outputs.sources_key }}
          restore-keys: |
            r2s-sources-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify preparation inputs
        run: |
          python3 -B ci/r2s/prepare.py toolchain
          python3 -B ci/r2s/prepare.py sources

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build shared environment once
        id: container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ci/r2s
          file: ci/r2s/Dockerfile
          platforms: linux/amd64
          load: true
          tags: r2s-debian-builder:ci
          cache-from: ${{ inputs.use_cache && 'type=gha,scope=r2s-debian-builder-v1' || '' }}
          cache-to: ${{ inputs.use_cache && 'type=gha,scope=r2s-debian-builder-v1,mode=max' || '' }}

      - name: Test Linux prerequisites and the nftables parser
        run: |
          sudo modprobe loop
          sudo modprobe binfmt_misc
          sudo modprobe btrfs
          docker run --rm --privileged \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/openwrt" \
            --env CI=true r2s-debian-builder:ci bash ci/r2s/linux-tests.sh

      - name: Seal preparation, source bundles and OCI environment
        id: context
        run: |
          docker image inspect r2s-debian-builder:ci > _ci/state/container.lock.json
          python3 -B ci/r2s/pipeline.py prepare --build-id "r2s-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Transfer build context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-context
          path: _ci/artifacts/context.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Transfer exact OCI environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-environment
          path: _ci/artifacts/environment.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Transfer verified compiler archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-toolchain
          path: _ci/artifacts/toolchain.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Transfer kernel source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-source-kernel
          path: _ci/artifacts/source-kernel.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Transfer U-Boot source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-source-uboot
          path: _ci/artifacts/source-uboot.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Transfer firmware source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context.outputs.namespace }}-source-firmware
          path: _ci/artifacts/source-firmware.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Save verified toolchain
        if: ${{ !cancelled() && inputs.use_cache && hashFiles('_ci/state/toolchain.ready') != '' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: _ci/cache/toolchain/*.tar.xz
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save verified Git objects
        if: ${{ !cancelled() && inputs.use_cache && hashFiles('_ci/state/sources.ready') != '' && steps.sources-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: _ci/cache/sources
          key: ${{ steps.sources-cache.outputs.cache-primary-key }}

      - name: Preparation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2s-debian13-logs-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _ci/logs/
            _ci/state/
          retention-days: 14
          if-no-files-found: warn

  kernel:
    needs: prepare
    uses: ./.github/workflows/r2s-stage.yml
    with:
      stage: kernel
      namespace: ${{ needs.prepare.outputs.namespace }}
      compat: ${{ needs.prepare.outputs.compat }}
      rootfs_key: ${{ needs.prepare.outputs.rootfs_key }}
      use_cache: ${{ inputs.use_cache }}

  uboot:
    needs: prepare
    uses: ./.github/workflows/r2s-stage.yml
    with:
      stage: uboot
      namespace: ${{ needs.prepare.outputs.namespace }}
      compat: ${{ needs.prepare.outputs.compat }}
      rootfs_key: ${{ needs.prepare.outputs.rootfs_key }}
      use_cache: ${{ inputs.use_cache }}

  rootfs:
    needs: prepare
    uses: ./.github/workflows/r2s-stage.yml
    with:
      stage: rootfs
      namespace: ${{ needs.prepare.outputs.namespace }}
      compat: ${{ needs.prepare.outputs.compat }}
      rootfs_key: ${{ needs.prepare.outputs.rootfs_key }}
      use_cache: ${{ inputs.use_cache }}

  assemble:
    needs: [prepare, kernel, uboot, rootfs]
    uses: ./.github/workflows/r2s-stage.yml
    with:
      stage: assemble
      namespace: ${{ needs.prepare.outputs.namespace }}
      compat: ${{ needs.prepare.outputs.compat }}
      rootfs_key: ${{ needs.prepare.outputs.rootfs_key }}
      use_cache: false

  verify:
    needs: [prepare, assemble]
    uses: ./.github/workflows/r2s-stage.yml
    with:
      stage: verify
      namespace: ${{ needs.prepare.outputs.namespace }}
      compat: ${{ needs.prepare.outputs.compat }}
      rootfs_key: ${{ needs.prepare.outputs.rootfs_key }}
      use_cache: false

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.namespace }}-context
          path: _ci/artifacts

      - name: Validate preparation context
        env:
          BUILD_ID: ${{ needs.prepare.outputs.namespace }}
        run: python3 -B ci/r2s/pipeline.py import context --build-id "$BUILD_ID"

      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.namespace }}-release
          path: _ci/artifacts

      - name: Validate publication payload
        run: |
          python3 -B ci/r2s/pipeline.py import release
          (cd _ci/release && sha256sum -c sha256sums)

      - name: Publish verified image, packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2s-debian13-${{ github.run_id }}-${{ github.run_attempt }}
          path: _ci/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Release summary
        env:
          BUILD_ID: ${{ needs.prepare.outputs.namespace }}
        run: |
          {
            printf "## R2S Debian 13 Router\n\nVerified build: \`%s\`\n\n" "$BUILD_ID"
            printf 'Kernel, U-Boot and rootfs were built in parallel with one shared OCI environment and source context.\n\n'
            printf "Download \`r2s-debian13-%s-%s\` in Artifacts. Retention: 14 days.\n" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"
