# Sourced by build.sh; this profile is copied to generated userpatches by CI.
BOARD=orangepir2s
BRANCH=current
BUILD_OPT=image
RELEASE=trixie
BUILD_DESKTOP=no
BUILD_MINIMAL=yes
KERNEL_CONFIGURE=no
BUILD_KSRC=no
INSTALL_KSRC=no
INSTALL_HEADERS=no
COPY_HEADERS=no
LOCK_INITIAL_PASSWORDS=yes
OPI_USERNAME='admin'
HOST=r2s
DESKTOP_AUTOLOGIN=no
EXTERNAL_NEW=no
EXTRAWIFI=no
PLYMOUTH=no
DEFAULT_CONSOLE=serial
USE_OVERLAYFS=no
ROOTFS_TYPE=btrfs
BOOTFS_TYPE=ext4
BOOTSIZE=512
BTRFS_COMPRESSION=zstd:3
BTRFS_ROOT_SUBVOL=@root
COMPRESS_OUTPUTIMAGE=gz,sha
DOWNLOAD_MIRROR=default
ARMBIAN_MIRROR=https://dl.armbian.com/
NO_APT_CACHER=yes
USE_TORRENT=no
GITEE_SERVER=no
USE_CCACHE=yes
PRIVATE_CCACHE=yes
# Packages must come from this run; cached compiler objects remain reusable.
CLEAN_LEVEL=debs,make
IGNORE_UPDATES=yes
# Dependencies and pinned downloads were prepared before entering the builder.
OFFLINE_WORK=yes
SYNC_CLOCK=no
ERROR_DEBUG_SHELL=no
EXIT_PATCHING_ERROR=yes
PROGRESS_DISPLAY=plain
PROGRESS_LOG_TO_FILE=yes
FORCE_USE_RAMDISK=yes
FORCE_TMPFS_SIZE=4096
DEBOOTSTRAP_GPG_OPTION=--keyring=/usr/share/keyrings/debian-archive-keyring.gpg

post_family_config__r2s_ci()
{
    source "${SRC}/_ci/state/build.env"
    BOOTBRANCH="commit:${R2S_UBOOT_COMMIT}"
    KERNELBRANCH="commit:${R2S_KERNEL_COMMIT}"
    # The headless router does not need the family's camera, SDK or GPIO demos.
    family_tweaks()
    {
        rsync -a --chown=root:root "${EXTER}/packages/bsp/ky/etc/initramfs-tools/" "${SDCARD}/etc/initramfs-tools/"
    }
    # Docker has its own /dev. Create only the loop nodes used for this image,
    # from kernel-reported major/minor numbers, without mounting host /dev.
    check_loop_device()
    {
        local device=$1 numbers attempt
        [[ $device =~ ^/dev/loop[0-9]+(p[0-9]+)?$ ]] || exit_with_error "Unexpected image device" "$device"
        [[ -b $device ]] && return 0
        for attempt in {1..20}; do
            if [[ -r /sys/class/block/${device##*/}/dev ]]; then
                numbers=$(< "/sys/class/block/${device##*/}/dev")
                mknod -m 0660 "$device" b "${numbers%:*}" "${numbers#*:}" || exit_with_error "Cannot create loop node" "$device"
                return 0
            fi
            sleep 0.25
        done
        exit_with_error "Loop device did not appear" "$device"
    }
    # Snapshot URLs use HTTPS for both bootstrap and later APT operations.
    create_sources_list()
    {
        [[ $1 == trixie && -n $2 ]] || exit_with_error "Unexpected CI distribution"
        cat > "$2/etc/apt/sources.list" <<EOF
deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${R2S_DEBIAN_SNAPSHOT}/ trixie main contrib non-free non-free-firmware
deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/${R2S_DEBIAN_SNAPSHOT}/ trixie-updates main contrib non-free non-free-firmware
deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/${R2S_DEBIAN_SNAPSHOT}/ trixie-security main contrib non-free non-free-firmware
EOF
    }
}

user_config__r2s_ci()
{
    DEBIAN_MIRROR="snapshot.debian.org/archive/debian/${R2S_DEBIAN_SNAPSHOT}/"
    APT_MIRROR_URL="https://${DEBIAN_MIRROR}"
    # Avoid the Docker CE helper, which has no riscv64 repository.
    PACKAGE_LIST_ADDITIONAL=""
}

post_aggregate_packages__r2s_ci()
{
    NAMESERVER=$(awk '/^nameserver / {print $2; exit}' /etc/resolv.conf)
    PACKAGE_LIST=$(awk '!/^#/ && NF {print $1}' "${SRC}/ci/r2s/packages.list" | xargs)
    PACKAGE_MAIN_LIST=$PACKAGE_LIST
    PACKAGE_LIST_ADDITIONAL=""
}

post_determine_cthreads__r2s_ci()
{
    CTHREADS="-j$(nproc)"
    umask 022
}

custom_kernel_config__r2s_ci()
{
    # Uncompressed DWARF greatly exceeds the hosted runner's disk budget.
    ./scripts/config --disable DEBUG_INFO --enable DEBUG_INFO_NONE \
        --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT --disable DEBUG_INFO_DWARF4 \
        --disable DEBUG_INFO_DWARF5 --disable DEBUG_INFO_BTF
    python3 "${SRC}/ci/r2s/kernel.py" apply "${LINUXSOURCEDIR}/.config" || exit_with_error "Cannot apply kernel contract"
}

post_kernel_config__r2s_ci()
{
    python3 "${SRC}/ci/r2s/kernel.py" verify "${LINUXSOURCEDIR}/.config" || exit_with_error "Kernel contract failed"
}

rootfs_cache_finalize__r2s_ci()
{
    chroot "${SDCARD}" sh -ec 'rm -f /etc/ssh/ssh_host_*; : > /etc/machine-id'
}

image_tweaks_post_customize__r2s_ci()
{
    bash "${SRC}/ci/r2s/configure-image.sh" "${SDCARD}" || exit_with_error "Router image configuration failed"
}

pre_prepare_partitions__r2s_ci()
{
    # shellcheck disable=SC2154
    # mountopts is the caller's dynamically scoped associative array.
    mountopts[btrfs]=',subvol=@root,compress=zstd:3,commit=30'
}

pre_mount_rootfs__r2s_ci()
{
    # shellcheck disable=SC2154
    # rootdevice is local to prepare_partitions and inherited by this hook.
    bash "${SRC}/ci/r2s/storage.sh" create "${rootdevice}" || exit_with_error "Cannot create Btrfs layout"
}

format_partitions__r2s_ci()
{
    bash "${SRC}/ci/r2s/storage.sh" mount "${rootdevice}" "${MOUNT}" "${SDCARD}" || exit_with_error "Cannot mount Btrfs layout"
}

pre_umount_final_image__r2s_ci()
{
    bash "${SRC}/ci/r2s/storage.sh" unmount "${MOUNT}" || exit_with_error "Cannot unmount Btrfs layout"
}

pre_install_distribution_specific__r2s_ci()
{
    # The base archive has been fully created before image-specific changes.
    bash "${SRC}/ci/r2s/cache.sh" rootfs || exit_with_error "Invalid rootfs cache"
}

post_build_image()
{
    if [[ ${R2S_STAGE:-} == assemble ]]; then
        # Full filesystem/ABI validation runs in the independent verify job.
        sha256sum "$1" | awk '{print $1 "  r2s-debian.img"}' > "${SRC}/_ci/state/raw-image.sha256"
        touch "${SRC}/_ci/state/image.assembled"
    else
        bash "${SRC}/ci/r2s/verify-image.sh" "$1" || exit_with_error "CI image validation failed"
    fi
}
